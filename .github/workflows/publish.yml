name: Publish a module

# A <module>-<version> tag, pushed by cz bump or given to a manual run, packs the
# module and adds it to index.yaml, both assets of the one release "modules".
on:
  push:
    tags:
      - "*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: The <module>-<version> tag to publish.
        required: true

permissions:
  contents: write

concurrency:
  group: publish-modules
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    name: Pack, index and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Pack the module and index it
        id: suil
        uses: oberon-systems/droch-shuil/publish@v0.7.1
        with:
          tag:       ${{ env.TAG }}
          index-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/modules

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modules
          name: Modules
          body: Module archives and index.yaml, the source suil installs from.
          make_latest: false
          files: ${{ steps.suil.outputs.dir }}/*
