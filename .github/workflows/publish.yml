name: Publish a module

# A <module>-<version> tag uploads its archive and index.yaml to the release
# "modules"; a change to index.yaml on main uploads index.yaml alone.
on:
  push:
    tags:
      - "*-*"
    branches:
      - main
    paths:
      - index.yaml

permissions:
  contents: write

concurrency:
  group: publish-modules
  cancel-in-progress: false

jobs:
  publish:
    name: Pack and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pack the release
        if: github.ref_type == 'tag'
        uses: oberon-systems/droch-shuil/publish@v0.7.3

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: modules
          name: Modules
          body: Module archives and index.yaml, the source suil installs from.
          make_latest: false
          files: ${{ github.ref_type == 'tag' && 'dist/*' || 'index.yaml' }}
