# The commitizen config of one module: `make module MODULE=<name>` writes it to
# modules/<name>/.cz.yaml in the shape `cz bump` dumps, so a bump changes one line.
---
commitizen:
  allowed_prefixes:
  - Merge
  - Revert
  - Pull request
  - fixup!
  - squash!
  - amend!
  - 'bump:'
  bump_message: 'bump: MODULE $current_version -> $new_version'
  changelog_file: modules/MODULE/CHANGELOG.md
  changelog_paths:
  - modules/MODULE
  ignored_tag_formats:
  - '*-$version'
  major_version_zero: true
  name: wyld_cz
  tag_format: MODULE-$version
  update_changelog_on_bump: true
  version: 0.1.0
  version_provider: commitizen
  version_scheme: semver
