# The commitizen config of one module: `make module MODULE=<name>` writes it to
# modules/<name>/.cz.yaml; `cz bump` run in modules/<name> reads it first.
---
commitizen:
  allowed_prefixes:
  - Merge
  - Revert
  - Pull request
  - fixup!
  - squash!
  - amend!
  - 'bump:'
  bump_message: 'bump: MODULE $current_version -> $new_version'
  changelog_file: CHANGELOG.md
  changelog_paths:
  - modules/MODULE
  ignored_tag_formats:
  - '*-$version'
  major_version_zero: true
  name: wyld_cz
  pre_bump_hooks:
  - cd ../.. && .venv/bin/suil index "$CZ_PRE_NEW_TAG_VERSION" && git add index.yaml
  tag_format: MODULE-$version
  update_changelog_on_bump: true
  version: 0.0.0
  version_provider: commitizen
  version_scheme: semver
