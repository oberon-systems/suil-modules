# Managed by suil, module `nginx`. Static: the paths below are literals.
# Answers every name no server claims: http goes to https, https says nothing.
server {
    listen 80 default_server;
    server_name _;
    access_log /var/log/nginx/default.log main;

    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    access_log /var/log/nginx/default.log main;
    default_type 'text/plain; charset=utf-8';

    ssl_certificate     /etc/nginx/cert/default.crt;
    ssl_certificate_key /etc/nginx/cert/default.key;

    return 200 '';
}
