---
commitizen:
  allowed_prefixes:
  - Merge
  - Revert
  - Pull request
  - fixup!
  - squash!
  - amend!
  - 'bump:'
  bump_message: 'bump: docker $current_version -> $new_version'
  changelog_file: CHANGELOG.md
  changelog_paths:
  - modules/docker
  ignored_tag_formats:
  - '*-$version'
  major_version_zero: true
  name: wyld_cz
  tag_format: docker-$version
  update_changelog_on_bump: true
  version: 0.0.0
  version_provider: commitizen
  version_scheme: semver
