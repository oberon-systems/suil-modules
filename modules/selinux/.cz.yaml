---
commitizen:
  allowed_prefixes:
  - Merge
  - Revert
  - Pull request
  - fixup!
  - squash!
  - amend!
  - 'bump:'
  bump_message: 'bump: selinux $current_version -> $new_version'
  changelog_file: CHANGELOG.md
  changelog_paths:
  - modules/selinux
  ignored_tag_formats:
  - '*-$version'
  major_version_zero: true
  name: wyld_cz
  pre_bump_hooks:
  - cd ../.. && .venv/bin/suil index "$CZ_PRE_NEW_TAG_VERSION" && git add index.yaml
  tag_format: selinux-$version
  update_changelog_on_bump: true
  version: 0.1.0
  version_provider: commitizen
  version_scheme: semver
